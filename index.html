<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Echo Fang · 作品档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
/* ====== ROOT ====== */
:root{
  --void-bg:#000;
  --void-deep:#020205;
  --blue:#00d4ff;
  --blue-bright:#7df9ff;
  --blue-deep:#0066ff;
  --blue-white:#e0f7ff;
  --blue-dim:rgba(0,212,255,.25);
  --blue-glow:rgba(0,212,255,.12);
  --text:#d0d0d0;
  --text-soft:#666;
  --text-muted:#333;
  --card-bg:#08080c;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-expo:cubic-bezier(.87,0,.13,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC","Manrope",sans-serif;
  background:var(--void-bg);
  color:var(--text);
  font-size:16px;line-height:1.6;
  overflow:hidden;
  transition:background .6s ease;
  touch-action:manipulation;
}
body[data-state="cards"]{overflow:auto;background:var(--void-deep)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* ====== SCENE VISIBILITY ====== */
.scene-void{
  position:fixed;inset:0;z-index:1;
  background:var(--void-bg);
  opacity:0;pointer-events:none;
  transition:opacity .8s ease;
}
body[data-state="exploding"] .scene-void,
body[data-state="void"] .scene-void,
body[data-state="collapsing"] .scene-void{opacity:1}
body[data-state="void"] .scene-void,
body[data-state="collapsing"] .scene-void{pointer-events:auto}

.white-layer{
  position:fixed;inset:0;z-index:10;
  background:#fafafa;
  overflow:hidden;
}
body[data-state="exploding"] .white-layer{
  animation:whiteBurn .8s ease-out .2s forwards;
}
body[data-state="void"] .white-layer,
body[data-state="collapsing"] .white-layer,
body[data-state="cards"] .white-layer{display:none}

.scene-cards{display:none}
body[data-state="cards"] .scene-cards{display:block}

@keyframes whiteBurn{
  0%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}
  20%{opacity:.98;filter:blur(1px) brightness(2)}
  50%{opacity:.5;filter:blur(12px) brightness(3)}
  100%{opacity:0;transform:scale(1.08);filter:blur(40px) brightness(5)}
}

/* ====== INITIAL PAGE (loading → idle) ====== */
.init-container{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  transition:opacity .5s ease;
}
body[data-state="loading"] .init-container{cursor:default}
body[data-state="idle"] .init-container{cursor:pointer}

/* Geometric accent above name */
.init-glyph{
  width:clamp(40px,5vw,56px);
  height:clamp(40px,5vw,56px);
  opacity:0;
  margin-bottom:24px;
}
body[data-state="loading"] .init-glyph{
  animation:glyphDraw 1.2s var(--ease-out) .2s forwards;
}
body[data-state="idle"] .init-glyph{
  opacity:.4;
  animation:glyphPulse 4s ease-in-out infinite;
}
@keyframes glyphDraw{
  0%{opacity:0;transform:rotate(-20deg) scale(.7)}
  100%{opacity:.4;transform:rotate(0) scale(1)}
}
@keyframes glyphPulse{
  0%,100%{opacity:.25;filter:drop-shadow(0 0 6px rgba(0,212,255,.2))}
  50%{opacity:.55;filter:drop-shadow(0 0 16px rgba(0,212,255,.5))}
}
.init-glyph path,
.init-glyph polygon,
.init-glyph circle,
.init-glyph line{
  stroke:var(--blue);
  stroke-width:1;
  fill:none;
  stroke-dasharray:200;
  stroke-dashoffset:200;
}
body[data-state="loading"] .init-glyph path,
body[data-state="loading"] .init-glyph polygon,
body[data-state="loading"] .init-glyph circle,
body[data-state="loading"] .init-glyph line{
  animation:strokeDraw 1s var(--ease-out) .3s forwards;
}
@keyframes strokeDraw{to{stroke-dashoffset:0}}

/* Name text */
.init-name{
  font-size:clamp(1.4rem,3.5vw,2.2rem);
  font-weight:300;
  letter-spacing:.05em;
  color:#222;
  overflow:hidden;
  display:flex;
  gap:.15em;
}
.init-name span{
  display:inline-block;
  opacity:0;
  transform:translateY(20px);
}
body[data-state="loading"] .init-name span{
  animation:letterSlide .5s var(--ease-out) forwards;
}
@keyframes letterSlide{to{opacity:1;transform:translateY(0)}}

/* Loading bar */
.init-bar{
  width:180px;height:1px;
  background:rgba(0,0,0,.08);
  overflow:hidden;
  margin-top:28px;
}
body[data-state="loading"] .init-bar-fill{
  height:100%;width:0;
  background:linear-gradient(to right,#222,var(--blue));
  animation:barFill 1s ease .4s forwards;
}
@keyframes barFill{to{width:100%}}

/* Idle hint */
.init-hint{
  margin-top:20px;
  font-size:13px;
  color:#999;
  display:flex;align-items:center;gap:8px;
  opacity:0;
}
body[data-state="idle"] .init-hint{
  animation:hintBlink 2.5s ease 1s infinite;
}
.init-hint-en{
  margin-top:4px;
  font-size:11px;
  color:#bbb;
  letter-spacing:.05em;
  opacity:0;
}
body[data-state="idle"] .init-hint-en{
  animation:hintBlink 2.5s ease 1.2s infinite;
}
.init-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--blue);flex-shrink:0;
  position:relative;
}
.init-dot::before{
  content:'';position:absolute;inset:-4px;
  border-radius:50%;border:1px solid var(--blue);
  animation:dotPulse 2s ease-out infinite;
}
@keyframes dotPulse{
  from{transform:scale(.7);opacity:1}
  to{transform:scale(2.5);opacity:0}
}
@keyframes hintBlink{
  0%,100%{opacity:.2}
  50%{opacity:.5}
}

/* ====== NUCLEAR EXPLOSION ====== */
.explosion-layer{
  position:fixed;inset:0;z-index:15;
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}

/* White-hot core */
.exp-core{
  position:absolute;
  width:0;height:0;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(230,247,255,1) 5%,
    rgba(125,249,255,.95) 12%,
    rgba(0,212,255,.7) 25%,
    rgba(0,102,255,.35) 40%,
    rgba(0,50,150,.08) 55%,
    transparent 70%);
}
body[data-state="exploding"] .exp-core{
  animation:nuclearCore .7s ease-out forwards;
}
@keyframes nuclearCore{
  0%{width:0;height:0;opacity:0}
  8%{width:60px;height:60px;opacity:1;filter:blur(0) brightness(1)}
  25%{width:300px;height:300px;opacity:1;filter:blur(0) brightness(1.5)}
  55%{width:700px;height:700px;opacity:.9;filter:blur(5px) brightness(2)}
  100%{width:1400px;height:1400px;opacity:0;filter:blur(30px) brightness(3)}
}
@media(max-width:560px){
  @keyframes nuclearCore{
    0%{width:0;height:0;opacity:0}
    10%{width:40px;height:40px;opacity:1;filter:blur(0) brightness(1)}
    30%{width:180px;height:180px;opacity:1;filter:blur(0) brightness(1.5)}
    60%{width:400px;height:400px;opacity:.8;filter:blur(5px) brightness(2)}
    100%{width:900px;height:900px;opacity:0;filter:blur(20px) brightness(3)}
  }
}

/* Flash overlay */
.exp-flash{
  position:fixed;inset:0;z-index:14;
  background:radial-gradient(circle at center,
    rgba(255,255,255,.9) 0%,
    rgba(125,249,255,.5) 30%,
    rgba(0,212,255,.2) 60%,
    transparent 100%);
  opacity:0;pointer-events:none;
}
body[data-state="exploding"] .exp-flash{
  animation:nuclearFlash .5s ease-out forwards;
}
@keyframes nuclearFlash{
  0%{opacity:0}
  15%{opacity:1}
  40%{opacity:.7}
  100%{opacity:0}
}

/* Shockwave rings */
.exp-shockwave{
  position:absolute;
  width:0;height:0;
  border-radius:50%;
  border:2px solid rgba(0,212,255,.6);
  opacity:0;
}
body[data-state="exploding"] .exp-shockwave:nth-child(1){
  animation:shockwaveExpand 1s ease-out 0s forwards;
}
body[data-state="exploding"] .exp-shockwave:nth-child(2){
  animation:shockwaveExpand 1.3s ease-out .12s forwards;
}
body[data-state="exploding"] .exp-shockwave:nth-child(3){
  animation:shockwaveExpand 1.6s ease-out .28s forwards;
}
body[data-state="exploding"] .exp-shockwave:nth-child(4){
  animation:shockwaveExpand 1.8s ease-out .45s forwards;
}
@keyframes shockwaveExpand{
  0%{width:0;height:0;opacity:1;border-width:4px}
  30%{opacity:.7;border-width:3px}
  60%{opacity:.3;border-width:1.5px}
  100%{width:1200px;height:1200px;opacity:0;border-width:0}
}
@media(max-width:560px){
  .exp-shockwave:nth-child(n+3){display:none}
  .exp-glow:nth-child(3){display:none}
  @keyframes shockwaveExpand{
    0%{width:0;height:0;opacity:1;border-width:3px}
    30%{opacity:.6;border-width:2px}
    100%{width:700px;height:700px;opacity:0;border-width:0}
  }
}

/* Radiating light beams (nuclear sun-rays) */
.exp-beams{
  position:absolute;
  width:0;height:0;
}
body[data-state="exploding"] .exp-beams{
  animation:beamsExpand .8s ease-out .05s forwards;
}
@keyframes beamsExpand{
  0%{width:0;height:0;opacity:0}
  20%{width:400px;height:400px;opacity:1}
  100%{width:2000px;height:2000px;opacity:0}
}
.exp-beam{
  position:absolute;
  left:50%;top:50%;
  width:1000px;height:3px;
  background:linear-gradient(to right,
    rgba(255,255,255,.8) 0%,
    rgba(125,249,255,.6) 20%,
    rgba(0,212,255,.3) 50%,
    transparent 100%);
  transform-origin:left center;
  border-radius:2px;
}

/* Fire-like glow layers */
.exp-glow{
  position:absolute;
  width:0;height:0;
  border-radius:50%;
}
body[data-state="exploding"] .exp-glow:nth-child(1){
  background:radial-gradient(circle,rgba(255,255,255,.6) 0%,rgba(0,212,255,.3) 30%,transparent 60%);
  animation:glowFire1 .5s ease-out forwards;
}
body[data-state="exploding"] .exp-glow:nth-child(2){
  background:radial-gradient(circle,rgba(0,212,255,.4) 0%,rgba(0,102,255,.15) 40%,transparent 70%);
  animation:glowFire2 .7s ease-out .1s forwards;
}
body[data-state="exploding"] .exp-glow:nth-child(3){
  background:radial-gradient(circle,rgba(125,249,255,.3) 0%,transparent 50%);
  animation:glowFire3 .9s ease-out .15s forwards;
}
@keyframes glowFire1{
  0%{width:0;height:0;opacity:0;filter:blur(0)}
  30%{width:350px;height:350px;opacity:1;filter:blur(4px)}
  100%{width:800px;height:800px;opacity:0;filter:blur(20px)}
}
@keyframes glowFire2{
  0%{width:0;height:0;opacity:0;filter:blur(0)}
  40%{width:550px;height:550px;opacity:.8;filter:blur(8px)}
  100%{width:1300px;height:1300px;opacity:0;filter:blur(35px)}
}
@keyframes glowFire3{
  0%{width:0;height:0;opacity:0;filter:blur(0)}
  40%{width:700px;height:700px;opacity:.6;filter:blur(12px)}
  100%{width:1800px;height:1800px;opacity:0;filter:blur(50px)}
}

/* Explosion particles */
.exp-particle{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

/* Screen shake (desktop only) */
body[data-state="exploding"] .white-layer{
  animation:whiteBurn .8s ease-out .2s forwards;
}
@media(min-width:769px){
  body[data-state="exploding"] .white-layer{
    animation:whiteBurn .8s ease-out .2s forwards, screenShake .4s ease-out;
  }
}
@keyframes screenShake{
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-4px,2px)}
  20%{transform:translate(3px,-3px)}
  30%{transform:translate(-2px,4px)}
  40%{transform:translate(4px,1px)}
  50%{transform:translate(-3px,-2px)}
  60%{transform:translate(2px,3px)}
  70%{transform:translate(-1px,-1px)}
}

/* ====== VOID STARS ====== */
.void-stars{position:absolute;inset:0;overflow:hidden}
.star{
  position:absolute;
  background:#fff;border-radius:50%;
  animation:twinkle 3s infinite alternate;
}
.star.bright{
  box-shadow:0 0 4px rgba(255,255,255,.8),0 0 10px rgba(0,212,255,.3);
}
.star.blue{
  background:var(--blue-bright);
  box-shadow:0 0 4px var(--blue),0 0 10px rgba(0,212,255,.4);
}
.star.large{
  box-shadow:0 0 6px rgba(255,255,255,.9),0 0 15px rgba(0,212,255,.4);
}
@keyframes twinkle{from{opacity:.06}to{opacity:.8}}

/* ====== VOID PERSPECTIVE (wider) ====== */
.void-perspective{
  position:absolute;inset:0;
  perspective:800px;
  perspective-origin:center center;
  transform-style:preserve-3d;
}
.void-stage{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform:translateZ(0);
}

/* ====== VOID GRID (wider, more expansive) ====== */
.void-grid-floor,.void-grid-ceiling{
  position:absolute;left:50%;
  width:600%;height:200%;
  background-image:
    linear-gradient(to right,rgba(0,212,255,.05) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,212,255,.05) 1px,transparent 1px);
  background-size:100px 100px;
}
.void-grid-floor{
  bottom:-15%;
  transform:translateX(-50%) rotateX(82deg);
  transform-origin:center top;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 15%,#000 65%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 15%,#000 65%,transparent 100%);
}
.void-grid-ceiling{
  top:-15%;
  transform:translateX(-50%) rotateX(-82deg);
  transform-origin:center bottom;
  -webkit-mask-image:linear-gradient(to top,transparent 0%,#000 15%,#000 65%,transparent 100%);
  mask-image:linear-gradient(to top,transparent 0%,#000 15%,#000 65%,transparent 100%);
}

/* Side walls for tunnel effect */
.void-grid-left,.void-grid-right{
  position:absolute;top:50%;
  width:200%;height:600%;
  background-image:
    linear-gradient(to right,rgba(0,212,255,.04) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,212,255,.04) 1px,transparent 1px);
  background-size:100px 100px;
}
.void-grid-left{
  left:-15%;
  transform:translateY(-50%) rotateY(82deg);
  transform-origin:right center;
  -webkit-mask-image:linear-gradient(to right,transparent 0%,#000 15%,#000 65%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0%,#000 15%,#000 65%,transparent 100%);
}
.void-grid-right{
  right:-15%;
  transform:translateY(-50%) rotateY(-82deg);
  transform-origin:left center;
  -webkit-mask-image:linear-gradient(to left,transparent 0%,#000 15%,#000 65%,transparent 100%);
  mask-image:linear-gradient(to left,transparent 0%,#000 15%,#000 65%,transparent 100%);
}

/* ====== VOID TITLE (Chinese primary, compact) ====== */
.void-title-block{
  position:absolute;top:40%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  transform-style:preserve-3d;
}
.void-title{
  font-size:clamp(1rem,2.2vw,1.5rem);
  font-weight:300;letter-spacing:.3em;
  color:rgba(255,255,255,.85);
  opacity:0;
  text-shadow:0 0 20px rgba(0,212,255,.3);
}
body[data-state="void"] .void-title{
  animation:titleFade 1.5s var(--ease-out) .4s forwards;
}
@keyframes titleFade{
  0%{opacity:0;transform:translateY(15px);filter:blur(8px)}
  100%{opacity:.85;transform:translateY(0);filter:blur(0)}
}
.void-subtitle{
  margin-top:10px;
  font-family:'Orbitron',monospace;
  font-size:clamp(.5rem,.9vw,.7rem);
  font-weight:400;letter-spacing:.2em;
  color:var(--blue);
  opacity:0;
  text-transform:uppercase;
}
body[data-state="void"] .void-subtitle{
  animation:titleFade 1.2s ease 1s forwards;
}
.void-divider{
  width:30px;height:1px;
  background:linear-gradient(to right,transparent,var(--blue),transparent);
  margin:14px auto;
  opacity:0;
}
body[data-state="void"] .void-divider{
  animation:dividerExpand 1s var(--ease-out) .8s forwards;
}
@keyframes dividerExpand{
  0%{opacity:0;width:0}
  100%{opacity:.6;width:30px}
}
.void-instruction{
  margin-top:4px;
  font-size:11px;
  color:var(--text-muted);
  opacity:0;letter-spacing:.08em;
}
body[data-state="void"] .void-instruction{
  animation:titleFade 1s ease 1.4s forwards;
}

/* ====== VOID DEBRIS (projects with depth) ====== */
.void-debris-container{
  position:absolute;top:50%;left:50%;
  transform-style:preserve-3d;
}
.debris-wrapper{
  position:absolute;
  transform-style:preserve-3d;
  transition:filter .4s ease;
}
.debris-content{
  text-align:center;
  animation:debrisFloat 8s ease-in-out infinite alternate;
  transition:transform .4s var(--ease);
  cursor:pointer;
}
.debris-wrapper:hover .debris-content{
  transform:scale(1.2) translateY(-6px);
}
.debris-wrapper:hover{
  filter:drop-shadow(0 0 15px rgba(0,212,255,.6));
}
.debris-wrapper:hover .debris-number{
  color:rgba(0,212,255,.4);
  text-shadow:0 0 25px rgba(0,212,255,.6);
}
.debris-wrapper:hover .debris-title{
  color:rgba(255,255,255,.9);
}
.debris-wrapper:hover .debris-en{
  color:rgba(0,212,255,.7);
}
@keyframes debrisFloat{
  from{transform:translateY(0) rotateY(-2deg)}
  to{transform:translateY(-20px) rotateY(2deg)}
}
.debris-number{
  font-family:'Orbitron',monospace;
  font-size:4rem;font-weight:900;
  color:rgba(0,212,255,.08);
  text-shadow:0 0 15px rgba(0,212,255,.1);
  line-height:1;
  transition:color .4s ease,text-shadow .4s ease;
}
.debris-title{
  font-size:1rem;font-weight:500;
  color:rgba(255,255,255,.3);
  margin-top:8px;
  transition:color .4s ease;
}
.debris-en{
  font-family:'Orbitron',monospace;
  font-size:.65rem;
  color:rgba(0,212,255,.2);
  text-transform:uppercase;letter-spacing:.1em;
  margin-top:4px;
  transition:color .4s ease;
}

/* ====== REAL CONSTELLATIONS ====== */
.constellation-svg{
  position:absolute;
  pointer-events:none;
  overflow:visible;
}
.const-star{
  fill:#fff;
  opacity:.5;
  animation:twinkle 4s infinite alternate;
}
.const-star.bright{
  fill:var(--blue-bright);
  opacity:.7;
  filter:drop-shadow(0 0 4px var(--blue));
}
.const-line{
  stroke:rgba(0,212,255,.12);
  stroke-width:1;
  fill:none;
  stroke-dasharray:2 3;
}

/* ====== VOID HUD ====== */
.void-hud{
  position:fixed;inset:0;
  z-index:50;pointer-events:none;
  opacity:0;
  transition:opacity .6s ease;
}
body[data-state="void"] .void-hud{opacity:1}
.hud-corner{
  position:absolute;width:24px;height:24px;
  border-color:rgba(0,212,255,.4);border-style:solid;
}
.hud-tl{top:24px;left:24px;border-width:1px 0 0 1px}
.hud-tr{top:24px;right:24px;border-width:1px 1px 0 0}
.hud-bl{bottom:24px;left:24px;border-width:0 0 1px 1px}
.hud-br{bottom:24px;right:24px;border-width:0 1px 1px 0}
.void-hint{
  position:absolute;top:28px;left:50%;
  transform:translateX(-50%);
  font-size:11px;color:var(--text-soft);
  letter-spacing:.15em;
}
.void-progress-bar{
  position:absolute;bottom:36px;left:50%;
  transform:translateX(-50%);
  width:160px;height:1px;
  background:rgba(0,212,255,.08);
}
.void-progress-fill{
  height:100%;width:0;
  background:var(--blue);
  box-shadow:0 0 6px var(--blue);
  transition:width .1s linear;
}
.void-depth-display{
  position:absolute;bottom:54px;left:50%;
  transform:translateX(-50%);
  font-family:'Orbitron',monospace;
  font-size:10px;color:var(--text-soft);
  letter-spacing:.15em;
}
.depth-label{color:var(--text-muted)}
.depth-value{color:var(--blue);margin:0 4px}
.depth-max{color:var(--text-muted)}
.collapse-warning{
  position:absolute;top:46%;left:50%;
  transform:translate(-50%,-50%);
  font-size:12px;color:var(--blue);
  letter-spacing:.15em;
  opacity:0;transition:opacity .4s ease;
  text-shadow:0 0 15px var(--blue);
}
.collapse-warning.show{
  opacity:1;
  animation:warningBlink .6s ease infinite alternate;
}
@keyframes warningBlink{from{opacity:.3}to{opacity:1}}

/* ====== SCAN LINES & VIGNETTE ====== */
.void-scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:40;

  transform:translateY(-8px) scale(1.025);

.card-sci-corner.br{bottom:6px;right:6px;border-width:0 1px 1px 0}

  aspect-ratio:4/3;overflow:hidden;

.card-sci:hover .card-sci-img img{
  transform:scale(1.05);
  filter:brightness(1) contrast(1.1);
}
.card-sci-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 50%);

}

.card-sci.from-left{animation:enterLeft .7s var(--ease-out) forwards}
.card-sci.from-right{animation:enterRight .7s var(--ease-out) forwards}
.card-sci.from-top{animation:enterTop .7s var(--ease-out) forwards}
.card-sci.from-bottom{animation:enterBottom .7s var(--ease-out) forwards}
.card-sci.from-tl{animation:enterTL .7s var(--ease-out) forwards}
.card-sci.from-tr{animation:enterTR .7s var(--ease-out) forwards}
.card-sci.from-bl{animation:enterBL .7s var(--ease-out) forwards}
.card-sci.from-br{animation:enterBR .7s var(--ease-out) forwards}

@keyframes enterRight{from{opacity:0;transform:translateX(250px) rotate(8deg) scale(.85)}to{opacity:1;transform:translateX(0) rotate(0) scale(1)}}
@keyframes enterTop{from{opacity:0;transform:translateY(-250px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes enterBottom{from{opacity:0;transform:translateY(250px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes enterTL{from{opacity:0;transform:translate(-250px,-250px) rotate(-10deg) scale(.85)}to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes enterTR{from{opacity:0;transform:translate(250px,-250px) rotate(10deg) scale(.85)}to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes enterBL{from{opacity:0;transform:translate(-250px,250px) rotate(10deg) scale(.85)}to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}
@keyframes enterBR{from{opacity:0;transform:translate(250px,250px) rotate(-10deg) scale(.85)}to{opacity:1;transform:translate(0,0) rotate(0) scale(1)}}

/* ====== MOBILE LIGHTWEIGHT MODE (2D fallback, no 3D engine) ====== */
@media(max-width:768px) and (hover:none){
  /* Kill all 3D compositing — the #1 cause of mobile jank */
  .void-perspective{
    perspective:none!important;
    transform-style:flat!important;
    transform:none!important;
  }
  .void-stage{
    transform-style:flat!important;
    transition:opacity .6s ease,filter .6s ease,transform .6s ease!important;
  }
  /* Remove 3D grid planes entirely */
  .void-grid-floor,.void-grid-ceiling,
  .void-grid-left,.void-grid-right{display:none!important}
  /* Remove debris and constellations (heavy DOM in 3D space) */
  .void-debris-container{display:none!important}
  .void-constellations{display:none!important}
  /* Flatten title block to 2D */
  .void-title-block{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%)!important;
    transform-style:flat!important;
  }
  /* Stars: fewer, slower, opacity-only animation */
  .star{will-change:opacity;animation-duration:6s!important}
  /* Remove grain / scanlines */
  .void-grain{display:none}
  .void-scanlines{display:none}
  .wireframe-cube{display:none}
  /* Touch action */
  .scene-void{touch-action:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* ================================================================
   STATE MACHINE
   ================================================================ */
let currentState='loading';
function setState(s){
  document.body.dataset.state=s;
  currentState=s;
  if(s==='void'||s==='exploding'||s==='collapsing'){
    document.body.style.overflow='hidden';
  }else if(s==='cards'){
    document.body.style.overflow='auto';
    window.scrollTo(0,0);
  }else{
    document.body.style.overflow='hidden';
  }
}

/* ================================================================
   LOADING - Render name letters
   ================================================================ */
function renderName(){
  var name="Echo Fang";
  var container=document.getElementById('initName');
  var delay=0;
  for(var i=0;i<name.length;i++){
    var span=document.createElement('span');
    if(name[i]===' '){
      span.innerHTML='&nbsp;';
      span.style.width='.25em';
    }else{
      span.textContent=name[i];
    }
    span.style.animationDelay=(delay+.3)+'s';
    delay+=.04;
    container.appendChild(span);
  }
}

/* ================================================================
   MOBILE DETECTION
   ================================================================ */
var isMobile=(function(){
  var ua=navigator.userAgent||'';
  var touch='ontouchstart' in window;
  var small=window.innerWidth<=768;
  return (touch && small) || /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
})();

/* ================================================================
   INIT
   ================================================================ */
function initLoading(){
  renderName();
  createStars();
  if(!isMobile){
    createDebris();
    createConstellations();
    createExplosionBeams();
  }
  setTimeout(function(){ setState('idle'); }, isMobile?1200:2200);
}

/* ================================================================
   CLICK / TAP TO EXPLODE
   ================================================================ */
function doExplode(){
  if(currentState!=='idle') return;
  createExplosionParticles();
  setState('exploding');
  setTimeout(function(){ setState('void'); },900);
}
document.addEventListener('click',doExplode);
/* Mobile: touchend is faster than click (no 300ms delay) */
if('ontouchend' in window){
  document.addEventListener('touchend',function(e){
    if(currentState==='idle'){
      e.preventDefault();
      doExplode();
    }
  },{passive:false});
}
document.addEventListener('keydown',function(e){
  if(currentState==='idle' && (e.key==='Enter'||e.key===' ')){
    e.preventDefault();
    doExplode();
  }
});

/* ================================================================
   EXPLOSION BEAMS (radiating sun-rays)
   ================================================================ */
function createExplosionBeams(){
  var container=document.getElementById('expBeams');
  var beamCount=24;
  for(var i=0;i<beamCount;i++){
    var beam=document.createElement('div');
    beam.className='exp-beam';
    var angle=(360/beamCount)*i;
    beam.style.transform='rotate('+angle+'deg)';
    beam.style.opacity=(0.3+Math.random()*0.5).toFixed(2);
    container.appendChild(beam);
  }
}

/* ================================================================
   EXPLOSION PARTICLES (fire-like, radiating outward)
   ================================================================ */
function createExplosionParticles(){
  var container=document.getElementById('explosionLayer');
  var count=isMobile?12:80;
  for(var i=0;i<count;i++){
    var particle=document.createElement('div');
    particle.className='exp-particle';
    var angle=(Math.PI*2*i/count)+(Math.random()-0.5)*0.4;
    var distance=150+Math.random()*600;
    var duration=0.5+Math.random()*0.6;
    var delay=Math.random()*0.12;
    var size=1+Math.random()*5;
    var colorMix=Math.random();
    var color,glow;
    if(colorMix<0.15){ color='rgba(255,255,255,1)'; glow='0 0 '+(size*3)+'px rgba(255,255,255,.8)'; }
    else if(colorMix<0.4){ color='rgba(125,249,255,.9)'; glow='0 0 '+(size*3)+'px rgba(125,249,255,.6)'; }
    else if(colorMix<0.7){ color='rgba(0,212,255,.7)'; glow='0 0 '+(size*2)+'px rgba(0,212,255,.5)'; }
    else{ color='rgba(0,102,255,.5)'; glow='0 0 '+(size*2)+'px rgba(0,102,255,.3)'; }

    particle.style.cssText=
      'width:'+size+'px;height:'+size+'px;'+
      'background:'+color+';'+
      'box-shadow:'+glow+';'+
      'transition:transform '+duration+'s cubic-bezier(.16,1,.3,1) '+delay+'s,opacity '+duration+'s ease '+delay+'s;'+
      'left:50%;top:50%;'+
      'transform:translate(-50%,-50%);';
    container.appendChild(particle);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var dx=Math.cos(angle)*distance;
        var dy=Math.sin(angle)*distance;
        particle.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(0)';
        particle.style.opacity='0';
      });
    });
    (function(p,d){ setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); },(d+0.3)*1000); })(particle,duration+delay);
  }
}

/* ================================================================
   MOUSE TRACKING
   ================================================================ */
var targetRX=0, targetRY=0, currentRX=0, currentRY=0;
document.addEventListener('mousemove',function(e){
  if(currentState==='void'||currentState==='collapsing'){
    targetRX=(e.clientY/window.innerHeight - 0.5)*5;
    targetRY=(e.clientX/window.innerWidth - 0.5)*-5;
  }else{
    targetRX=0; targetRY=0;
  }
});
function animatePerspective(){
  /* Mobile: skip 3D perspective loop entirely — saves a continuous rAF */
  if(isMobile) return;
  currentRX += (targetRX - currentRX)*0.05;
  currentRY += (targetRY - currentRY)*0.05;
  var persp=document.getElementById('voidPerspective');
  if(persp) persp.style.transform='rotateX('+currentRX.toFixed(2)+'deg) rotateY('+currentRY.toFixed(2)+'deg)';
  requestAnimationFrame(animatePerspective);
}

/* ================================================================
   VOID SCROLL
   ================================================================ */
var voidDepth=0;
var VOID_MAX_DEPTH=3000;
var COLLAPSE_THRESHOLD=isMobile?1500:2500;
var collapseTriggered=false;

function handleWheel(e){
  if(currentState!=='void') return;
  if(isMobile) return; /* mobile uses touch events, not wheel */
  e.preventDefault();
  voidDepth += e.deltaY*2;
  if(voidDepth<0) voidDepth=0;
  if(voidDepth>VOID_MAX_DEPTH) voidDepth=VOID_MAX_DEPTH;
  updateVoidScene();
  if(voidDepth>=COLLAPSE_THRESHOLD && !collapseTriggered){
    collapseTriggered=true;
    triggerCollapse();
  }
}
var touchStartY=0;
var touchStartX=0;
function handleTouchStart(e){
  if(currentState==='void'){
    touchStartY=e.touches[0].clientY;
    touchStartX=e.touches[0].clientX;
  }
}
function handleTouchMove(e){
  if(currentState!=='void') return;
  e.preventDefault();
  var deltaY=touchStartY - e.touches[0].clientY;
  touchStartY=e.touches[0].clientY;
  touchStartX=e.touches[0].clientX;
  /* Mobile: swipe up = go deeper. Sensitivity tuned for 2D mode. */
  voidDepth += deltaY*5;
  if(voidDepth<0) voidDepth=0;
  if(voidDepth>VOID_MAX_DEPTH) voidDepth=VOID_MAX_DEPTH;
  updateVoidScene();
  if(voidDepth>=COLLAPSE_THRESHOLD && !collapseTriggered){
    collapseTriggered=true;
    triggerCollapse();
  }
}
function updateVoidScene(){
  var stage=document.getElementById('voidStage');
  var progress=Math.min(voidDepth/VOID_MAX_DEPTH,1);
  /* Mobile: 2D-only — scale + opacity instead of translateZ + 3D shake */
  if(isMobile){
    var scale=1 - progress*0.3;
    var opacity=1 - progress*0.4;
    stage.style.transform='scale('+scale.toFixed(3)+')';
    stage.style.opacity=opacity.toFixed(3);
  }else{
    var shakeX=0, shakeY=0;
    if(voidDepth > COLLAPSE_THRESHOLD*0.85){
      var intensity=(voidDepth - COLLAPSE_THRESHOLD*0.85)/(COLLAPSE_THRESHOLD*0.15);
      shakeX=(Math.random()-0.5)*3*intensity;
      shakeY=(Math.random()-0.5)*3*intensity;
    }
    stage.style.transform='translateZ('+voidDepth.toFixed(1)+'px) translate('+shakeX.toFixed(1)+'px,'+shakeY.toFixed(1)+'px)';
  }
  document.getElementById('voidProgress').style.width=(progress*100)+'%';
  document.getElementById('depthValue').textContent=String(Math.floor(voidDepth)).padStart(4,'0');
  if(voidDepth > COLLAPSE_THRESHOLD*0.85) document.getElementById('collapseWarning').classList.add('show');
}

/* ================================================================
   COLLAPSE
   ================================================================ */
function triggerCollapse(){
  setState('collapsing');
  var flash=document.getElementById('explosionLayer');
  var core=document.createElement('div');
  core.style.cssText='position:absolute;width:0;height:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(0,212,255,.6) 15%,transparent 50%);animation:nuclearCore 0.5s ease-out forwards;';
  flash.appendChild(core);
  setTimeout(function(){ if(core.parentNode) core.parentNode.removeChild(core); },600);
  var stage=document.getElementById('voidStage');
  if(isMobile){
    /* Mobile: simple 2D fade, no 3D scale or heavy blur filter */
    stage.style.transition='opacity .6s ease';
    stage.style.opacity='0';
    stage.style.filter='blur(8px)';
  }else{
    stage.style.transition='transform 1s cubic-bezier(0.5,0,0.5,1), opacity 1s ease, filter 1s ease';
    stage.style.transform='translateZ(0) scale(0)';
    stage.style.opacity='0';
    stage.style.filter='blur(25px)';
  }
  setTimeout(function(){
    document.getElementById('sceneVoid').style.display='none';
    setState('cards');
    renderCards();
  },isMobile?800:1300);
}

function createStars(){
  var container=document.getElementById('voidStars');
  var starCount=isMobile?60:450;
  for(var i=0;i<starCount;i++){
    var star=document.createElement('div');
    star.className='star';
    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';
    var brightness=Math.random();
    star.style.opacity=(brightness*0.6+0.08).toFixed(2);
    star.style.animationDelay=Math.random()*4+'s';
    star.style.animationDuration=(Math.random()*3+2.5)+'s';
    var size=Math.random();
    if(size<0.04){
      star.classList.add('bright','large');
      star.style.width='3px';star.style.height='3px';
    }else if(size<0.1){
      star.classList.add('blue');
      star.style.width='2.5px';star.style.height='2.5px';
    }else if(size<0.15){
      star.classList.add('bright');
      star.style.width='2px';star.style.height='2px';
    }else{
      var s=Math.random()*1.5+0.5;
      star.style.width=s+'px';star.style.height=s+'px';
    }
    container.appendChild(star);
  }
}

      line.setAttribute('x1',s1.x);
      line.setAttribute('y1',s1.y);
      line.setAttribute('x2',s2.x);
      line.setAttribute('y2',s2.y);
      svg.appendChild(line);
    });

    /* Draw stars */
    c.stars.forEach(function(s,i){
      var star=document.createElementNS('http://www.w3.org/2000/svg','circle');
      star.setAttribute('class','const-star'+(i===0||s.s>=3?' bright':''));
      star.setAttribute('cx',s.x);
      star.setAttribute('cy',s.y);
      star.setAttribute('r',s.s);
      star.style.animationDelay=(Math.random()*4)+'s';
      svg.appendChild(star);
    });

    container.appendChild(svg);
  });
}

/* ================================================================
   CARD RENDERING
   ================================================================ */
function renderCards(){
  var grid=document.getElementById('cardsGrid');
  grid.innerHTML='';
  var directions=['from-left','from-top','from-right','from-bottom','from-tl','from-tr','from-bl','from-br'];
  var placeholder='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%230a0a0f%22 width=%22400%22 height=%22300%22/%3E%3C/svg%3E';
  projects.forEach(function(p,i){
    var card=document.createElement('div');
    card.className='card-sci '+directions[i%directions.length];
    card.style.animationDelay=(i*100+300)+'ms';
    card.innerHTML=
      '<div class="card-sci-corner tl"></div>'+
      '<div class="card-sci-corner tr"></div>'+
      '<div class="card-sci-corner bl"></div>'+
      '<div class="card-sci-corner br"></div>'+
      '<div class="card-sci-img">'+
        '<img src="'+p.cover+'" alt="'+p.title+'" loading="lazy" onerror="this.src=\''+placeholder+'\'" />'+
        '<div class="card-sci-overlay"></div>'+
      '</div>'+
      '<div class="card-sci-body">'+
        '<div class="card-sci-num">PROJECT '+p.num+'</div>'+
        '<div class="card-sci-title">'+p.title+'</div>'+
        '<div class="card-sci-en">'+p.en+'</div>'+
      '</div>';
    card.addEventListener('click',function(){ openDetail(p); });
    grid.appendChild(card);
  });
}

/* ================================================================
   DETAIL OVERLAY
   ================================================================ */
var overlay=document.getElementById('overlay');
var overlayContent=document.getElementById('overlayContent');
var overlayClose=document.getElementById('overlayClose');

function openDetail(p){
  var html='';
  html+='<div class="detail-hero">';
  html+='<div class="detail-cover"><img src="'+p.cover+'" alt="'+p.title+'" onerror="this.style.display=\'none\'"/></div>';
  html+='<div class="detail-title">'+p.title+'</div>';
  html+='<div class="detail-en">'+p.en+'</div>';
  html+='<div class="detail-desc">'+p.desc+'</div>';
  html+='<ul class="detail-highlights">';
  p.highlights.forEach(function(h){ html+='<li>'+h+'</li>'; });
  html+='</ul>';
  if(p.awardNote) html+='<div class="detail-award">'+p.awardNote+'</div>';
  html+='</div>';
  if(p.sections){
    p.sections.forEach(function(s){
      var themeClass=s.theme?' theme':'';
      html+='<div class="detail-section'+themeClass+'">';
      html+='<h3>'+s.zh+'</h3>';
      html+='<div class="section-en">'+s.en+'</div>';
      if(s.desc) html+='<p class="section-desc">'+s.desc+'</p>';
      html+='<div class="detail-grid">';
      s.imgs.forEach(function(img,i){
        var full=(s.imgs.length===1||(i===0&&s.imgs.length<=2))?' full':'';
        html+='<div class="img-wrap'+full+'"><img src="./'+s.dir+'/'+img+'" alt="'+s.zh+' '+(i+1)+'" loading="lazy" data-lb="./'+s.dir+'/'+img+'" onerror="this.style.display=\'none\'"/></div>';
      });
      html+='</div></div>';
    });
  } else if(p.imgs){
    html+='<div class="detail-section">';
    html+='<h3>作品图片</h3>';
    html+='<div class="section-en">Project Gallery</div>';
    html+='<div class="detail-grid">';
    p.imgs.forEach(function(img,i){
      var full=(i===0)?' full':'';
      html+='<div class="img-wrap'+full+'"><img src="./'+p.dir+'/'+img+'" alt="'+p.title+' '+(i+1)+'" loading="lazy" data-lb="./'+p.dir+'/'+img+'" onerror="this.style.display=\'none\'"/></div>';
    });
    html+='</div></div>';
  }
  overlayContent.innerHTML=html;
  overlayContent.querySelectorAll('img[data-lb]').forEach(function(img){
    img.addEventListener('click',function(){
      lbImg.src=this.getAttribute('data-lb');
      lightbox.classList.add('show');
    });
  });
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  overlay.scrollTop=0;
}
function closeDetail(){
  overlay.classList.remove('open');
  if(currentState==='cards') document.body.style.overflow='auto';
  else document.body.style.overflow='hidden';
}
overlayClose.addEventListener('click',closeDetail);

var lightbox=document.getElementById('lightbox');
var lbImg=document.getElementById('lbImg');
var lbClose=document.getElementById('lbClose');
lbClose.addEventListener('click',function(){ lightbox.classList.remove('show'); });
lightbox.addEventListener('click',function(e){ if(e.target===lightbox) lightbox.classList.remove('show'); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(lightbox.classList.contains('show')) lightbox.classList.remove('show');
    else if(overlay.classList.contains('open')) closeDetail();
  }
});
document.getElementById('btnReenter').addEventListener('click',function(){ location.reload(); });

   INIT
   ================================================================ */
window.addEventListener('wheel',handleWheel,{passive:false});
window.addEventListener('touchstart',handleTouchStart,{passive:true});
window.addEventListener('touchmove',handleTouchMove,{passive:false});
initLoading();
animatePerspective();
